<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>영웅 시험장 · CHRONO BREAK</title>
<style>
  :root { --acc: #ff7a2f; --ink: #f2f4f8; --dim: #9aa3b5; --panel: rgba(12, 14, 20, .72); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0d0f14; color: var(--ink);
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; user-select: none; }
  canvas { display: block; }
  #cross { position: fixed; left: 50%; top: 50%; width: 0; height: 0; pointer-events: none; }
  #cross .ring { position: absolute; left: -22px; top: -22px; width: 44px; height: 44px; border-radius: 50%;
    border: 2px solid rgba(255,255,255,.85); box-shadow: 0 0 0 1px rgba(0,0,0,.45); transition: width .08s, height .08s, left .08s, top .08s; }
  #cross .dot { position: absolute; left: -2px; top: -2px; width: 4px; height: 4px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 1px #000; }
  #hit { position: fixed; left: 50%; top: 50%; width: 30px; height: 30px; margin: -15px 0 0 -15px; pointer-events: none; opacity: 0; }
  #hit::before, #hit::after { content: ""; position: absolute; left: 50%; top: 0; width: 3px; height: 100%; margin-left: -1.5px; background: #fff; transform: rotate(45deg); box-shadow: 0 0 0 1px #000; }
  #hit::after { transform: rotate(-45deg); }
  #hit.crit::before, #hit.crit::after { background: #ff4b4b; }
  #ammo { position: fixed; right: 36px; bottom: 30px; text-align: right; font-weight: 800; text-shadow: 0 2px 6px #000; }
  #ammo b { font-size: 54px; } #ammo span { font-size: 22px; color: var(--dim); }
  #ammo small { display: block; font-size: 13px; color: var(--acc); letter-spacing: .1em; height: 16px; }
  #name { position: fixed; left: 36px; bottom: 30px; text-shadow: 0 2px 6px #000; }
  #name b { font-size: 30px; font-weight: 900; letter-spacing: .04em; } #name div { color: var(--dim); font-size: 13px; }
  #keys { position: fixed; left: 24px; top: 20px; background: var(--panel); padding: 12px 16px; border-radius: 10px; font-size: 13px; line-height: 1.75; color: var(--dim); }
  #keys kbd { display: inline-block; min-width: 22px; padding: 0 6px; margin-right: 6px; border-radius: 4px; background: #262b38; color: var(--ink); text-align: center; font: 700 12px/20px system-ui; }
  #stats { position: fixed; right: 24px; top: 20px; background: var(--panel); padding: 10px 14px; border-radius: 10px; font-size: 13px; color: var(--dim); text-align: right; line-height: 1.7; }
  #stats b { color: var(--ink); }
  #start { position: fixed; inset: 0; display: grid; place-items: center; background: radial-gradient(ellipse at center, rgba(10,12,18,.55), rgba(10,12,18,.92)); }
  #start .go { cursor: pointer; }
  .picks { display: flex; gap: 14px; justify-content: center; margin-top: 26px; }
  .pick { width: 130px; padding: 14px 10px; border-radius: 12px; background: rgba(255,255,255,.06); border: 2px solid transparent; cursor: pointer; transition: .15s; }
  .pick:hover { background: rgba(255,255,255,.1); }
  .pick.on { border-color: var(--acc); background: rgba(255,122,47,.12); }
  .pick b { display: block; font-size: 22px; } .pick span { font-size: 13px; color: var(--dim); }
  #start .box { text-align: center; }
  #start h1 { font-size: 64px; font-weight: 900; letter-spacing: .06em; }
  #start h1 em { color: var(--acc); font-style: normal; }
  #start p { margin-top: 10px; color: var(--dim); font-size: 16px; }
  #start .go { display: inline-block; margin-top: 28px; padding: 14px 34px; border-radius: 999px; background: var(--acc); color: #111; font-weight: 900; font-size: 18px; }
  #start .load { margin-top: 18px; font-size: 13px; color: var(--dim); }
  #abil { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%); display: flex; gap: 12px; align-items: flex-end; }
  .ab { position: relative; width: 92px; height: 64px; border-radius: 10px; background: var(--panel); overflow: hidden; border: 2px solid rgba(255,255,255,.12); text-align: center; }
  .ab .fill { position: absolute; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,.55); height: 0; }
  .ab kbd { position: relative; display: inline-block; margin-top: 8px; padding: 0 6px; border-radius: 4px; background: #262b38; color: var(--ink); font: 700 11px/18px system-ui; }
  .ab .nm { position: relative; display: block; margin-top: 6px; font-size: 13px; font-weight: 700; }
  .ab .cdn { position: absolute; inset: 0; display: grid; place-items: center; font-size: 26px; font-weight: 900; text-shadow: 0 2px 4px #000; }
  .ab.cool .nm, .ab.cool kbd { opacity: .35; }
  .ab.on { border-color: #7fdcff; box-shadow: 0 0 14px rgba(127,220,255,.6); }
  #ult { --p: 0deg; position: relative; width: 84px; height: 84px; border-radius: 50%; background: conic-gradient(var(--acc) var(--p), rgba(255,255,255,.12) 0); display: grid; place-items: center; margin: 0 4px; }
  #ult::before { content: ""; position: absolute; inset: 6px; border-radius: 50%; background: #141821; }
  #ult .pct { position: relative; font-size: 22px; font-weight: 900; }
  #ult .nm { position: absolute; bottom: -20px; left: 50%; transform: translateX(-50%); white-space: nowrap; font-size: 12px; color: var(--dim); }
  #ult.ready { box-shadow: 0 0 22px var(--acc); animation: pulse 1s infinite; }
  #ult.ready .pct { color: var(--acc); }
  @keyframes pulse { 50% { box-shadow: 0 0 6px var(--acc); } }
  .dmg { position: fixed; pointer-events: none; font-weight: 900; font-size: 20px; color: #fff; text-shadow: 0 2px 4px #000, 0 0 2px #000; transform: translate(-50%, -50%); }
  .dmg.crit { color: #ff5555; font-size: 26px; }
  #small { display: none; position: fixed; inset: 0; background: #0d0f14; place-items: center; text-align: center; padding: 24px; font-size: 17px; line-height: 1.6; z-index: 9; }
  @media (max-width: 760px) { #small { display: grid; } }
</style>
<script type="importmap">{"imports":{"three":"./lib/three.module.min.js","three/addons/":"./lib/addons/"}}</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="cross"><div class="ring" id="ring"></div><div class="dot"></div></div>
<div id="hit"></div>
<div id="keys">
  <div><kbd>W A S D</kbd>이동 &nbsp;<kbd>Shift</kbd>걷기</div>
  <div><kbd>Space</kbd>점프 &nbsp;<kbd>R</kbd>장전</div>
  <div><kbd>좌클릭</kbd>산탄총</div>
  <div><kbd>T</kbd>정면에서 보기 &nbsp;<kbd>1</kbd><kbd>2</kbd>영웅 바꾸기</div>
</div>
<div id="stats">처치 <b id="kills">0</b> · 명중률 <b id="acc">-</b><br>마지막 한 발 <b id="last">0</b></div>
<div id="abil">
  <div class="ab" id="ab1"><div class="fill"></div><kbd>SHIFT</kbd><span class="nm"></span><b class="cdn"></b></div>
  <div id="ult"><div class="pct">0%</div><span class="nm"></span></div>
  <div class="ab" id="ab2"><div class="fill"></div><kbd>E</kbd><span class="nm"></span><b class="cdn"></b></div>
</div>
<div id="name"><b id="hname">래칫</b><div id="hsub">돌파형 탱커 · 충각판 산탄총</div></div>
<div id="ammo"><small id="reload"></small><b id="mag">6</b><span id="magmax"> / 6</span></div>
<div id="start"><div class="box">
  <h1>영웅 <em>시험장</em></h1>
  <p>새로 만든 3D 모델로 걷고, 뛰고, 쏴보기</p>
  <div class="picks"><div class="pick on" data-id="ratchet"><b>래칫</b><span>산탄총</span></div><div class="pick" data-id="orbit"><b>오비트</b><span>에너지 소총</span></div><div class="pick" data-id="tick"><b>틱</b><span>쌍권총</span></div><div class="pick" data-id="nok"><b>녹</b><span>전쟁 망치</span></div></div>
  <div class="go" id="go">불러오는 중…</div>
  <div class="load" id="load">모델 준비 중</div>
</div></div>
<div id="small">이 시험장은 노트북·PC(키보드와 마우스)용이야.<br>큰 화면에서 열어줘.</div>
<script type="module" src="./js/play.js"></script>
</body>
</html>
