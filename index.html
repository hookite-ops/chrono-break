<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CHRONO BREAK</title>
<style>
  :root { --acc: #ff7a2f; --ink: #f2f4f8; --dim: #9aa3b5; --panel: rgba(12, 14, 20, .74); --blue: #3aa0ff; --red: #ff3344; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0d0f14; color: var(--ink);
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; user-select: none; }
  canvas { display: block; }
  .hidden { display: none !important; }
  button { font: inherit; cursor: pointer; border: 0; }
  /* ── 메뉴 */
  #menu { position: fixed; inset: 0; display: grid; place-items: center; background: radial-gradient(ellipse at 50% 40%, rgba(10,8,20,.15), rgba(8,6,16,.55) 60%, rgba(6,5,12,.88)); }
  #menu h1 { text-shadow: 0 0 30px rgba(255,138,42,.35), 0 4px 18px rgba(0,0,0,.6); }
  #menu .box { width: min(1060px, 94vw); text-align: center; }
  #menu h1 { font-size: 64px; font-weight: 900; letter-spacing: .12em; }
  #menu h1 em { color: var(--acc); font-style: normal; }
  #menu .tag { color: var(--dim); margin-top: 6px; }
  .grid { display: grid; grid-template-columns: repeat(9, 1fr); gap: 10px; margin: 26px 0 18px; }
  .card { position: relative; border-radius: 12px; overflow: hidden; background: rgba(16,14,26,.86); backdrop-filter: blur(6px); border: 2px solid transparent; cursor: pointer; padding-bottom: 8px; transition: .15s; }
  .card img { width: 100%; aspect-ratio: 3/4; object-fit: cover; display: block; background: #1c2130; }
  .card b { display: block; margin-top: 6px; font-size: 16px; } .card span { font-size: 11px; color: var(--dim); }
  .card:hover { transform: translateY(-3px); background: rgba(34,30,50,.92); }
  .card.sel { border-color: var(--acc); background: rgba(70,36,22,.92); box-shadow: 0 0 22px rgba(255,122,47,.35); }
  .card.off { opacity: .35; cursor: not-allowed; }
  .opts { display: flex; gap: 24px; justify-content: center; align-items: center; color: var(--dim); font-size: 14px; }
  .opts select, .opts input { margin-left: 8px; }
  select { background: #1c2130; color: var(--ink); border: 1px solid #333a4a; border-radius: 6px; padding: 4px 8px; font: inherit; }
  .big { margin-top: 22px; padding: 15px 46px; border-radius: 999px; background: var(--acc); color: #111; font-weight: 900; font-size: 19px; }
  .big:disabled { background: #444; color: #999; cursor: default; }
  #loadtxt { margin-top: 10px; font-size: 13px; color: var(--dim); height: 18px; }
  .links { margin-top: 14px; font-size: 13px; } .links a { color: var(--dim); margin: 0 8px; }
  .keys { margin-top: 18px; color: var(--dim); font-size: 13px; line-height: 1.8; }
  kbd { display: inline-block; min-width: 20px; padding: 0 6px; margin: 0 3px; border-radius: 4px; background: #262b38; color: var(--ink); text-align: center; font: 700 11px/19px system-ui; }
  /* ── HUD */
  #cross { position: fixed; left: 50%; top: 50%; width: 0; height: 0; pointer-events: none; }
  #ring { position: absolute; left: -22px; top: -22px; width: 44px; height: 44px; border-radius: 50%; border: 2px solid rgba(255,255,255,.8); box-shadow: 0 0 0 1px rgba(0,0,0,.45); transition: width .08s, height .08s, left .08s, top .08s; }
  #cross .dot { position: absolute; left: -2px; top: -2px; width: 4px; height: 4px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 1px #000; }
  #hit { position: fixed; left: 50%; top: 50%; width: 30px; height: 30px; margin: -15px 0 0 -15px; pointer-events: none; opacity: 0; }
  #hit::before, #hit::after { content: ""; position: absolute; left: 50%; top: 0; width: 3px; height: 100%; margin-left: -1.5px; background: #fff; transform: rotate(45deg); box-shadow: 0 0 0 1px #000; }
  #hit::after { transform: rotate(-45deg); } #hit.crit::before, #hit.crit::after { background: #ff4b4b; } #hit.kill { width: 44px; height: 44px; margin: -22px 0 0 -22px; } #hit.kill::before, #hit.kill::after { background: #ff3030; width: 4px; box-shadow: 0 0 8px #ff3030; }
  #vign { position: fixed; inset: 0; pointer-events: none; opacity: 0; background: radial-gradient(ellipse at center, transparent 55%, rgba(200,0,20,.55)); }
  #flashov { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
  .dmgdir { position: fixed; left: 50%; top: 50%; width: 0; height: 0; border-left: 26px solid transparent; border-right: 26px solid transparent; border-bottom: 34px solid rgba(255,40,40,.85); pointer-events: none; }
  #obj { position: fixed; left: 50%; top: 14px; transform: translateX(-50%); display: flex; align-items: center; gap: 14px; }
  .sbar { width: 220px; height: 14px; border-radius: 7px; background: rgba(0,0,0,.5); overflow: hidden; position: relative; }
  .sbar i { display: block; height: 100%; } #sb { background: var(--blue); margin-left: auto; } #sr { background: var(--red); }
  .sbar.b { display: flex; justify-content: flex-end; }
  .stxt { font-weight: 900; font-size: 18px; width: 52px; text-shadow: 0 2px 4px #000; } #sbt { color: var(--blue); text-align: right; } #srt { color: var(--red); }
  #pring { --p: 0deg; --c: #fff; width: 54px; height: 54px; border-radius: 50%; background: conic-gradient(var(--c) var(--p), rgba(0,0,0,.45) 0); display: grid; place-items: center; }
  #pdot { width: 40px; height: 40px; border-radius: 50%; background: #ddd; display: grid; place-items: center; color: #111; font-weight: 900; font-size: 15px; box-shadow: inset 0 0 0 3px rgba(0,0,0,.25); }
  #pstate { position: fixed; left: 50%; top: 74px; transform: translateX(-50%); font-weight: 800; font-size: 14px; text-shadow: 0 2px 4px #000; }
  #feed { position: fixed; right: 18px; top: 14px; display: flex; flex-direction: column; gap: 4px; align-items: flex-end; }
  .kf { background: var(--panel); padding: 4px 10px; border-radius: 6px; font-size: 13px; } .kf.me { box-shadow: inset 0 0 0 1px var(--acc); }
  .kf .b { color: var(--blue); font-weight: 800; } .kf .r { color: var(--red); font-weight: 800; } .kf i { color: var(--dim); font-style: normal; font-size: 11px; margin: 0 6px 0 3px; }
  #me { position: fixed; left: 28px; bottom: 26px; text-shadow: 0 2px 6px #000; }
  #me b { font-size: 26px; font-weight: 900; } #me .sub { color: var(--dim); font-size: 12px; margin-bottom: 8px; }
  .hp { width: 280px; height: 18px; background: rgba(0,0,0,.55); border-radius: 4px; overflow: hidden; position: relative; }
  #hpfill { height: 100%; width: 100%; background: linear-gradient(90deg, #e9f1ff, #ffffff); }
  #shfill { position: absolute; left: 0; top: 0; height: 100%; width: 0; background: rgba(120,200,255,.75); }
  #hptxt { margin-top: 4px; font-weight: 800; font-size: 15px; }
  #ammo { position: fixed; right: 32px; bottom: 26px; text-align: right; font-weight: 800; text-shadow: 0 2px 6px #000; }
  #ammo b { font-size: 50px; } #ammo span { font-size: 20px; color: var(--dim); }
  #ammo small { display: block; font-size: 13px; color: var(--acc); letter-spacing: .1em; height: 16px; }
  #rmbhint { position: fixed; right: 32px; bottom: 100px; font-size: 12px; color: var(--dim); }
  #abil { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); display: flex; gap: 12px; align-items: flex-end; }
  .ab { position: relative; width: 92px; height: 62px; border-radius: 10px; background: var(--panel); overflow: hidden; border: 2px solid rgba(255,255,255,.12); text-align: center; }
  .ab .fill { position: absolute; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,.55); height: 0; }
  .ab kbd { position: relative; margin-top: 8px; }
  .ab .nm { position: relative; display: block; margin-top: 5px; font-size: 12px; font-weight: 700; }
  .ab .cdn { position: absolute; inset: 0; display: grid; place-items: center; font-size: 26px; font-weight: 900; text-shadow: 0 2px 4px #000; }
  .ab.cool .nm, .ab.cool kbd { opacity: .35; } .ab.on { border-color: #7fdcff; box-shadow: 0 0 14px rgba(127,220,255,.6); }
  #ult { --p: 0deg; position: relative; width: 80px; height: 80px; border-radius: 50%; background: conic-gradient(var(--acc) var(--p), rgba(255,255,255,.12) 0); display: grid; place-items: center; margin: 0 4px; }
  #ult::before { content: ""; position: absolute; inset: 6px; border-radius: 50%; background: #141821; }
  #ult .pct { position: relative; font-size: 21px; font-weight: 900; }
  #ult .nm { position: absolute; bottom: -19px; left: 50%; transform: translateX(-50%); white-space: nowrap; font-size: 12px; color: var(--dim); }
  #ult.ready { box-shadow: 0 0 22px var(--acc); animation: pulse 1s infinite; } #ult.ready .pct { color: var(--acc); }
  @keyframes pulse { 50% { box-shadow: 0 0 6px var(--acc); } }
  #killban { position: fixed; left: 50%; top: 62%; transform: translateX(-50%); font-size: 18px; color: #fff; opacity: 0; text-shadow: 0 2px 4px #000; pointer-events: none; }
  #killban b { color: var(--red); } #killban.show { animation: kb 1.6s; }
  @keyframes kb { 0% { opacity: 0; transform: translate(-50%, 8px) scale(1.2); } 12% { opacity: 1; transform: translate(-50%, 0) scale(1); } 75% { opacity: 1; } 100% { opacity: 0; } }
  #cmsg { position: fixed; left: 50%; top: 26%; transform: translateX(-50%); text-align: center; opacity: 0; transition: opacity .3s; pointer-events: none; text-shadow: 0 2px 8px #000; }
  #cmsg b { display: block; font-size: 40px; font-weight: 900; } #cmsg span { color: var(--dim); }
  .dmg { position: fixed; pointer-events: none; font-weight: 900; font-size: 19px; color: #fff; text-shadow: 0 2px 4px #000; transform: translate(-50%, -50%); }
  .dmg.crit { color: #ff5555; font-size: 25px; } .dmg.heal { color: #8aff9a; }
  #plates { position: fixed; inset: 0; pointer-events: none; }
  .plate { position: absolute; transform: translate(-50%, -100%); text-align: center; font-size: 12px; font-weight: 700; text-shadow: 0 1px 3px #000; }
  .plate div { width: 64px; height: 6px; background: rgba(0,0,0,.6); border-radius: 3px; overflow: hidden; margin: 2px auto 0; }
  .plate i { display: block; height: 100%; } .plate.enemy i { background: var(--red); } .plate.ally i { background: var(--blue); } .plate.ally span { color: #bfe0ff; }
  /* ── 오버레이 */
  .ov { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(8,10,14,.72); }
  .ov .box { background: var(--panel); padding: 28px 34px; border-radius: 16px; text-align: center; min-width: 320px; }
  .ov h2 { font-size: 30px; margin-bottom: 14px; }
  .ov .row { display: flex; gap: 10px; justify-content: center; margin-top: 18px; }
  .btn { padding: 11px 22px; border-radius: 10px; background: #2a3040; color: var(--ink); font-weight: 800; }
  .btn.p { background: var(--acc); color: #111; }
  #death { background: rgba(60,0,10,.25); pointer-events: none; }
  #death .box { background: transparent; } #death b { font-size: 34px; } #rtime { font-size: 60px; font-weight: 900; display: block; }
  #swap .box { width: min(980px, 94vw); }
  #restitle { font-size: 64px; font-weight: 900; } #restitle.win { color: var(--blue); } #restitle.lose { color: var(--red); }
  #board { background: transparent; pointer-events: none; }
  #board table { border-collapse: collapse; margin: 8px auto; min-width: 420px; }
  #board td { padding: 5px 14px; text-align: left; } #board tr.blue td:first-child { color: var(--blue); } #board tr.red td:first-child { color: var(--red); } #board tr.me { background: rgba(255,122,47,.18); }
  #small { display: none; position: fixed; inset: 0; background: #0d0f14; place-items: center; text-align: center; padding: 24px; font-size: 17px; line-height: 1.6; z-index: 9; }
  @media (max-width: 760px) { #small { display: grid; } }
  @media (max-width: 1100px) { .grid { grid-template-columns: repeat(5, 1fr); } }
</style>
<script type="importmap">{"imports":{"three":"./lib/three.module.min.js","three/addons/":"./lib/addons/"}}</script>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud" class="hidden">
  <div id="vign"></div><div id="flashov"></div>
  <div id="plates"></div>
  <div id="cross"><div id="ring"></div><div class="dot"></div></div>
  <div id="hit"></div>
  <div id="obj"><span class="stxt" id="sbt">0%</span><div class="sbar b"><i id="sb"></i></div><div id="pring"><div id="pdot">A</div></div><div class="sbar"><i id="sr"></i></div><span class="stxt" id="srt">0%</span></div>
  <div id="pstate"></div>
  <div id="feed"></div>
  <div id="cmsg"></div>
  <div id="killban"></div>
  <div id="me"><b id="hname"></b><div class="sub" id="hsub"></div><div class="hp"><div id="hpfill"></div><div id="shfill"></div></div><div id="hptxt"></div></div>
  <div id="abil">
    <div class="ab" id="ab1"><div class="fill"></div><kbd>SHIFT</kbd><span class="nm"></span><b class="cdn"></b></div>
    <div id="ult"><div class="pct">0%</div><span class="nm"></span></div>
    <div class="ab" id="ab2"><div class="fill"></div><kbd>E</kbd><span class="nm"></span><b class="cdn"></b></div>
  </div>
  <div id="rmbhint"></div>
  <div id="ammo"><small id="reload"></small><b id="mag">0</b><span id="magmax"></span></div>
</div>

<div id="menu">
  <div class="box">
    <h1>CHRONO <em>BREAK</em></h1>
    <div class="tag">시간이 부서진 도시의 5대5 거점전 · 영웅을 고르세요</div>
    <div class="grid" id="herogrid"></div>
    <div class="opts">
      <label>봇 난이도<select id="diff"><option value="0">쉬움</option><option value="1">보통</option><option value="2">어려움</option></select></label>
      <label>마우스 감도<input id="sens" type="range" min="0.3" max="2.5" step="0.05"></label>
      <label>그래픽<select id="gfx"><option value="2">높음</option><option value="1">보통</option><option value="0">낮음 (빠름)</option></select></label>
    </div>
    <button class="big" id="startbtn" disabled>불러오는 중…</button>
    <div id="loadtxt"></div>
    <div class="keys"><kbd>WASD</kbd>이동 <kbd>Space</kbd>점프 <kbd>좌클릭</kbd>공격 <kbd>우클릭</kbd>치유(지원) <kbd>R</kbd>장전 <kbd>Shift</kbd><kbd>E</kbd>스킬 <kbd>Q</kbd>궁극기 <kbd>H</kbd>영웅 교체 <kbd>Tab</kbd>점수판 <kbd>Esc</kbd>멈춤</div>
    <div class="links"><a href="play.html">영웅 시험장</a> · <a href="classic.html">예전 버전</a></div>
  </div>
</div>

<div id="pause" class="ov hidden"><div class="box"><h2>일시 정지</h2>
  <div class="row"><button class="btn p" id="resume">계속</button><button class="btn" id="toswap">영웅 교체</button><button class="btn" id="tomenu">메뉴로</button></div></div></div>
<div id="swap" class="ov hidden"><div class="box"><h2>영웅 교체</h2><div class="grid" id="swapgrid"></div><button class="btn" id="swapclose">닫기</button></div></div>
<div id="death" class="ov hidden"><div class="box"><b>쓰러졌습니다</b><div id="killer" style="color:#ff8a8a;margin:6px 0"></div><span id="rtime">5</span><div style="color:#ccc">H 영웅 교체</div></div></div>
<div id="board" class="ov hidden"><div class="box"><h2>점수판</h2>
  <table><thead><tr><td>파랑 팀</td><td>영웅</td><td>처치</td><td>쓰러짐</td></tr></thead><tbody id="boardb"></tbody></table>
  <table><thead><tr><td>빨강 팀</td><td>영웅</td><td>처치</td><td>쓰러짐</td></tr></thead><tbody id="boardr"></tbody></table></div></div>
<div id="result" class="ov hidden"><div class="box"><div id="restitle"></div><div id="resstat" style="margin-top:8px;color:#ccd"></div>
  <div class="row"><button class="btn p" id="again">다시 하기</button><button class="btn" id="resmenu">메뉴로</button></div></div></div>
<div id="small">이 게임은 노트북·PC(키보드와 마우스)용이야.<br>큰 화면에서 열어줘.</div>
<script type="module" src="./js/game.js"></script>
</body>
</html>
