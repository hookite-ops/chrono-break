# 배포할 때마다 옛날 파일이 남지 않게: 매번 서버에 바뀌었는지 물어봄(안 바뀌었으면 304로 짧게 끝남)
server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml model/gltf-binary application/octet-stream;
  gzip_min_length 1024;
  location ~ \.glb$ {
    default_type model/gltf-binary;
    add_header Cache-Control "no-cache" always;
  }
  location / {
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ =404;
  }
}
